<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-7반 학급 달력</title>
<style>
  :root{
    --ink:#23201c; --muted:#8a8378; --line:#e7e2d8; --paper:#fbf9f4;
    --card:#ffffff; --accent:#c65a2e; --sun:#d93025; --sat:#1a73e8;
    --chip:#f3efe6; --shadow:0 1px 2px rgba(40,32,20,.06),0 8px 24px rgba(40,32,20,.06);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:940px; margin:0 auto; padding:20px 16px 56px}
  header.top{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:6px 2px 18px}
  header.top h1{font-size:22px; margin:0; letter-spacing:-.02em}
  header.top .sub{color:var(--muted); font-size:13px}
  .navbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 12px; box-shadow:var(--shadow); margin-bottom:14px;
  }
  .navbar .mtitle{font-size:18px; font-weight:700; letter-spacing:-.01em}
  .navbar button{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    width:40px; height:40px; border-radius:10px; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .navbar button:hover{background:var(--chip)}
  .navbar .today-btn{width:auto; padding:0 14px; font-size:13px; font-weight:600}
  .grid{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow)}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); background:#f7f3ea; border-bottom:1px solid var(--line)}
  .dow div{padding:10px 0; text-align:center; font-size:13px; font-weight:700; color:var(--muted)}
  .dow div.s0{color:var(--sun)} .dow div.s6{color:var(--sat)}
  .days{display:grid; grid-template-columns:repeat(7,1fr)}
  .cell{
    min-height:98px; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:6px 7px; position:relative; cursor:default; transition:background .12s;
  }
  .cell:nth-child(7n){border-right:none}
  .cell.blank{background:#faf8f2}
  .cell.has{cursor:pointer}
  .cell.has:hover{background:#fdfaf3}
  .cell .dnum{font-size:14px; font-weight:700; color:var(--ink)}
  .cell.s0 .dnum{color:var(--sun)} .cell.s6 .dnum{color:var(--sat)}
  .cell.today .dnum{
    background:var(--accent); color:#fff; border-radius:8px;
    width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center;
  }
  .evs{margin-top:4px; display:flex; flex-direction:column; gap:3px}
  .ev{
    font-size:11px; line-height:1.25; background:var(--chip); color:#4a4438;
    border-left:3px solid var(--accent); border-radius:4px; padding:2px 5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ev.hol{background:#fdecea; color:#b0281a; border-left-color:var(--sun); font-weight:600}
  .more{font-size:10.5px; color:var(--muted); padding-left:2px}
  .state{padding:40px 16px; text-align:center; color:var(--muted); font-size:14px; line-height:1.7}
  .state code{background:var(--chip); padding:1px 6px; border-radius:5px; font-size:12px}
  /* modal */
  .ov{position:fixed; inset:0; background:rgba(35,28,20,.42); display:none; align-items:center; justify-content:center; padding:18px; z-index:50}
  .ov.on{display:flex}
  .modal{background:var(--card); border-radius:16px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(30,22,12,.28); overflow:hidden; animation:pop .16s ease}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .modal .mh{padding:18px 20px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center}
  .modal .mh .d{font-size:18px; font-weight:800}
  .modal .mh .w{font-size:12px; color:var(--muted); margin-top:2px}
  .modal .x{border:none; background:var(--chip); width:34px; height:34px; border-radius:9px; font-size:18px; cursor:pointer; color:var(--muted)}
  .modal .mb{padding:14px 20px 20px; max-height:60vh; overflow:auto}
  .modal .item{padding:11px 12px; border-radius:10px; background:#faf7f0; border:1px solid var(--line); margin-bottom:9px; font-size:14.5px; line-height:1.5; white-space:pre-wrap}
  .modal .item.hol{background:#fdecea; border-color:#f5c6c0; color:#b0281a; font-weight:600}
  .foot{margin-top:16px; text-align:center; color:var(--muted); font-size:12px}
  @media(max-width:560px){
    .cell{min-height:74px; padding:4px 4px}
    .cell .dnum{font-size:12.5px}
    .ev{font-size:10px} .navbar .mtitle{font-size:16px}
    header.top h1{font-size:19px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>3-7반 학급 달력</h1>
    <span class="sub">날짜를 누르면 그날 일정이 자세히 보여요</span>
  </header>

  <div class="navbar">
    <button id="prev" aria-label="이전 달">‹</button>
    <div class="mtitle" id="mtitle">불러오는 중…</div>
    <div style="display:flex;gap:8px">
      <button class="today-btn" id="todayBtn">오늘</button>
      <button id="next" aria-label="다음 달">›</button>
    </div>
  </div>

  <div class="grid">
    <div class="dow">
      <div class="s0">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="s6">토</div>
    </div>
    <div class="days" id="days"><div class="state">달력을 불러오는 중입니다…</div></div>
  </div>

  <div class="foot">교사가 시트 &lt;일정&gt; 탭을 수정하면 이 달력에도 자동 반영됩니다.</div>
</div>

<div class="ov" id="ov">
  <div class="modal">
    <div class="mh">
      <div><div class="d" id="mDate"></div><div class="w" id="mWeek"></div></div>
      <button class="x" id="mClose">×</button>
    </div>
    <div class="mb" id="mBody"></div>
  </div>
</div>

<script>
/* ===================== 설정 ===================== */
const CONFIG = {
  SHEET_ID:  "12ZYq08gqaEqgjriBpjGoMJBwV01WgPjRC2lt1bjLjTw",
  SHEET_NAME:"일정",     // 월/일/내용 입력 시트 이름
  START_YEAR:2026,       // 8~12월 → 이 연도
  NEXT_YEAR: 2027        // 1~7월  → 다음 연도
};
const WEEK_KR = ["일","월","화","수","목","금","토"];

/* 대한민국 공휴일 (Apps Script와 동일) */
const HOLIDAYS = {
  "2026-8-15":"광복절","2026-8-17":"대체공휴일(광복절)",
  "2026-9-24":"추석 연휴","2026-9-25":"추석","2026-9-26":"추석 연휴",
  "2026-10-3":"개천절","2026-10-5":"대체공휴일(개천절)","2026-10-9":"한글날",
  "2026-12-25":"성탄절","2027-1-1":"신정"
};

/* 입력의 '월'로 연도 판단 (Apps Script와 동일 규칙) */
function yearForMonth(m){ return (Number(m) >= 8) ? CONFIG.START_YEAR : CONFIG.NEXT_YEAR; }

/* gviz CSV 주소 (시트가 '링크가 있는 모든 사용자 보기' 또는 웹 게시 상태여야 함) */
function dataUrl(){
  return "https://docs.google.com/spreadsheets/d/"+CONFIG.SHEET_ID+
         "/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(CONFIG.SHEET_NAME)+
         "&headers=1&_="+Date.now();
}

/* ===================== CSV 파서 ===================== */
function parseCSV(text){
  const rows=[]; let row=[], field="", i=0, q=false;
  while(i<text.length){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    }else{
      if(c==='"') q=true;
      else if(c===',' ){ row.push(field); field=""; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c==='\r'){ /* skip */ }
      else field+=c;
    }
    i++;
  }
  row.push(field); rows.push(row);
  return rows;
}

/* ===================== 상태 ===================== */
let EVENTS = {};                // "YYYY-M-D" -> [내용...]
let view = { y: CONFIG.START_YEAR, m: 8 }; // 기본 2026년 8월

function keyOf(y,m,d){ return y+"-"+m+"-"+d; }

async function loadData(){
  try{
    const res = await fetch(dataUrl());
    if(!res.ok) throw new Error("HTTP "+res.status);
    const txt = await res.text();
    const rows = parseCSV(txt);
    const map = {};
    for(let r=1;r<rows.length;r++){   // 0행은 머리글(월/일/내용)
      const cols = rows[r];
      if(!cols) continue;
      const mo = (cols[0]||"").trim();
      const da = (cols[1]||"").trim();
      const tx = (cols[2]||"").trim();
      if(!mo || !da || !tx) continue;
      const y = yearForMonth(mo);
      const k = keyOf(y, Number(mo), Number(da));
      (map[k] = map[k] || []).push(tx);
    }
    EVENTS = map;
    render();
  }catch(err){
    document.getElementById("mtitle").textContent = view.y+"년 "+view.m+"월";
    document.getElementById("days").innerHTML =
      '<div class="state">시트를 아직 불러올 수 없어요.<br><br>'+
      '구글 시트에서 <b>공유 → 링크가 있는 모든 사용자 &ldquo;뷰어&rdquo;</b> 로 바꾸거나,<br>'+
      '<b>파일 → 공유 → 웹에 게시</b> 로 &lt;일정&gt; 탭을 게시하면 표시됩니다.<br>'+
      '<br><code>'+String(err.message||err)+'</code></div>';
    render(true);
  }
}

/* ===================== 렌더 ===================== */
function render(skipData){
  const {y,m} = view;
  document.getElementById("mtitle").textContent = y+"년 "+m+"월";
  if(skipData) return;

  const first = new Date(y, m-1, 1);
  const startW = first.getDay();
  const dim = new Date(y, m, 0).getDate();
  const today = new Date();
  const days = document.getElementById("days");
  days.innerHTML = "";

  const total = Math.ceil((startW+dim)/7)*7;
  for(let i=0;i<total;i++){
    const cell = document.createElement("div");
    const col = i%7;
    const dayNum = i - startW + 1;
    if(dayNum<1 || dayNum>dim){ cell.className="cell blank"; days.appendChild(cell); continue; }

    cell.className = "cell s"+col;
    const key = keyOf(y,m,dayNum);
    const holiday = HOLIDAYS[key];
    const userEvs = EVENTS[key] || [];
    // 표시 목록: 공휴일 먼저, 그다음 입력 일정
    const items = [];
    if(holiday) items.push({text:holiday, holiday:true});
    userEvs.forEach(t=>items.push({text:t, holiday:false}));

    if(holiday) cell.classList.add("s0");         // 공휴일 날짜 빨강
    if(items.length) cell.classList.add("has");
    if(today.getFullYear()===y && today.getMonth()===m-1 && today.getDate()===dayNum) cell.classList.add("today");

    const dn = document.createElement("div"); dn.className="dnum"; dn.textContent=dayNum;
    cell.appendChild(dn);

    if(items.length){
      const box=document.createElement("div"); box.className="evs";
      items.slice(0,2).forEach(it=>{
        const e=document.createElement("div"); e.className="ev"+(it.holiday?" hol":""); e.textContent=it.text; box.appendChild(e);
      });
      if(items.length>2){ const mo=document.createElement("div"); mo.className="more"; mo.textContent="+"+(items.length-2)+"개 더"; box.appendChild(mo); }
      cell.appendChild(box);
      cell.addEventListener("click", ()=>openDay(y,m,dayNum,items));
    }
    days.appendChild(cell);
  }
}

/* ===================== 모달 ===================== */
function openDay(y,m,d,items){
  const w = new Date(y,m-1,d).getDay();
  const hol = HOLIDAYS[keyOf(y,m,d)];
  document.getElementById("mDate").textContent = y+"년 "+m+"월 "+d+"일";
  const we=document.getElementById("mWeek"); we.textContent = WEEK_KR[w]+"요일"+(hol?" · 공휴일":"");
  we.style.color = (w===0||hol)?"var(--sun)":(w===6?"var(--sat)":"var(--muted)");
  const body=document.getElementById("mBody"); body.innerHTML="";
  items.forEach(it=>{ const el=document.createElement("div"); el.className="item"+(it.holiday?" hol":""); el.textContent=it.text; body.appendChild(el); });
  document.getElementById("ov").classList.add("on");
}
function closeModal(){ document.getElementById("ov").classList.remove("on"); }

/* ===================== 이벤트 ===================== */
document.getElementById("prev").onclick = ()=>{ view.m--; if(view.m<1){view.m=12;view.y--;} render(); };
document.getElementById("next").onclick = ()=>{ view.m++; if(view.m>12){view.m=1;view.y++;} render(); };
document.getElementById("todayBtn").onclick = ()=>{ const t=new Date(); view={y:t.getFullYear(), m:t.getMonth()+1}; render(); };
document.getElementById("mClose").onclick = closeModal;
document.getElementById("ov").onclick = (e)=>{ if(e.target.id==="ov") closeModal(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

loadData();
</script>
</body>
</html>
